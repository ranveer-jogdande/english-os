<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131925">
<title>English OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23131925'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='%23fff' text-anchor='middle'%3EEO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: desktop = fixed sidebar + scrolling workspace; phone = workspace + bottom tab bar with a "More" sheet. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF2; --surface-3:#DFE5EC;
  --ink:#131925; --ink-2:#2B3445; --muted:#5D6779; --line:#D6DDE6;
  --accent:#0A766B; --accent-ink:#FFFFFF; --accent-soft:#DAEFEC; --accent-line:#9ED2CA;
  --warm:#B8680F; --warm-soft:#F8E8D2;
  --good:#23824F; --good-soft:#DDF0E4; --warn:#9A6A08; --warn-soft:#F6ECCF; --bad:#B93A33; --bad-soft:#F7DFDC;
  --shadow:0 1px 2px rgba(19,25,37,.06),0 8px 24px -12px rgba(19,25,37,.18);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1219; --surface:#141B25; --surface-2:#1B2431; --surface-3:#243041;
  --ink:#E8EDF4; --ink-2:#C9D2DF; --muted:#8E9AAD; --line:#253142;
  --accent:#3DC4B3; --accent-ink:#04211D; --accent-soft:#11302C; --accent-line:#1E5C54;
  --warm:#EBA24C; --warm-soft:#33240F;
  --good:#5BCB8C; --good-soft:#12301F; --warn:#E3B54A; --warn-soft:#30260E; --bad:#F07A70; --bad-soft:#3A1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1219; --surface:#141B25; --surface-2:#1B2431; --surface-3:#243041;
  --ink:#E8EDF4; --ink-2:#C9D2DF; --muted:#8E9AAD; --line:#253142;
  --accent:#3DC4B3; --accent-ink:#04211D; --accent-soft:#11302C; --accent-line:#1E5C54;
  --warm:#EBA24C; --warm-soft:#33240F;
  --good:#5BCB8C; --good-soft:#12301F; --warn:#E3B54A; --warn-soft:#30260E; --bad:#F07A70; --bad-soft:#3A1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.4vw,34px);font-weight:750}
h2{font-size:22px;font-weight:650}
h3{font-size:17px;font-weight:650}
h4{font-size:15px;font-weight:650}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.92em}
.tab-nums{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px 18px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:750;font-size:15px;letter-spacing:-.04em}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:750;letter-spacing:.01em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:11.5px;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--ink-2);font-weight:550;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;opacity:.8}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav button.on svg{opacity:1}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--bad-soft);color:var(--bad);border-radius:20px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--muted);vertical-align:1px}
.status-dot.on{background:var(--good)}.status-dot.off{background:var(--warn)}

.main{min-width:0;padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin-top:6px;max-width:62ch}
.topbar{display:none}
.bottom{display:none}

/* session bar */
.session-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;box-shadow:var(--shadow)}
.session-bar .steps{display:flex;gap:4px;flex:1;min-width:120px}
.session-bar .steps i{flex:1;height:5px;border-radius:4px;background:color-mix(in srgb,var(--bg) 25%,transparent)}
.session-bar .steps i.d{background:var(--accent)}
.session-bar .steps i.c{background:var(--bg)}
.session-bar b{font-size:13px;font-weight:650}
.session-bar .btn{background:var(--bg);color:var(--ink);border-color:transparent}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.flat{background:transparent}
.card.tint{background:var(--surface-2);border-color:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.s6{gap:6px}.stack.s18{gap:18px}
.btn{white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;transition:transform .12s ease,background .15s ease,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.lg{min-height:52px;padding:0 24px;font-size:15.5px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:20px}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.chip.line{background:transparent;border:1px solid var(--line)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:11px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:650;color:var(--ink-2)}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px;line-height:1.5;transition:border-color .15s}
textarea{resize:vertical;min-height:110px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-weight:500}
.opt:hover{border-color:var(--accent-line)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.6}
.pillset{display:flex;gap:8px;flex-wrap:wrap}
.pill{all:unset;cursor:pointer;padding:8px 14px;border:1px solid var(--line);border-radius:30px;font-size:13.5px;font-weight:600;background:var(--surface)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:7px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}.bar.good>i{background:var(--good)}
.divider{height:1px;background:var(--line);margin:4px 0}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0;min-width:0}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:11px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.note svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--muted)}
.note.warn{background:var(--warn-soft)}.note.warn svg{color:var(--warn)}
.note.good{background:var(--good-soft)}.note.good svg{color:var(--good)}
.note.acc{background:var(--accent-soft)}.note.acc svg{color:var(--accent)}
.empty{text-align:center;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty svg{width:36px;height:36px;opacity:.6}
.empty h3{color:var(--ink)}
.timer{font-family:var(--f-mono);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.big{font-size:54px}
.timer.low{color:var(--bad)}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;gap:14px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}
.list>.li:last-child{border-bottom:none}
.li .grow{flex:1;min-width:0}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);flex:none;color:var(--ink-2)}
.ic svg{width:19px;height:19px}
.ic.acc{background:var(--accent-soft);color:var(--accent)}
.ic.done{background:var(--good-soft);color:var(--good)}
.fade-in{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.hero-main{background:var(--ink);color:var(--bg);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.hero-main .eyebrow{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.hero-main h1{color:var(--bg)}
.hero-main .focus-list{display:flex;flex-direction:column;gap:8px}
.hero-main .focus-item{display:flex;gap:10px;align-items:center;font-weight:600}
.hero-main .focus-item small{font-weight:500;color:color-mix(in srgb,var(--bg) 62%,transparent)}
.hero-main .focus-item i{width:22px;height:22px;border-radius:6px;background:color-mix(in srgb,var(--bg) 14%,transparent);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;flex:none}
.hero-main .btn.primary{align-self:flex-start}
.hero-wave{position:absolute;right:-30px;top:-30px;opacity:.13;pointer-events:none}
.level-card{display:flex;flex-direction:column;gap:14px}
.level-big{font-family:var(--f-display);font-size:44px;font-weight:750;letter-spacing:-.03em;line-height:1}
.level-big .arrow{color:var(--muted);font-weight:500;font-size:28px;margin:0 6px}
.stats-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px;border-radius:11px;background:var(--surface-2)}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:650;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.rings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ring-cell{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;border-radius:12px;padding:10px 4px;border:none;background:none}
.ring-cell:hover{background:var(--surface-2)}
.ring{position:relative;width:76px;height:76px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:650;font-size:15px;font-variant-numeric:tabular-nums}
.ring-cell small{font-size:12.5px;font-weight:650;color:var(--ink-2)}
.ring-cell em{font-style:normal;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cta-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cta{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s,transform .15s}
.cta:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.cta b{font-family:var(--f-display);font-size:17px;font-weight:650}
.cta span{font-size:12.5px;color:var(--muted)}
.cta .ic{background:var(--accent-soft);color:var(--accent)}

/* word card */
.word-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.word-title{font-family:var(--f-display);font-size:40px;font-weight:750;letter-spacing:-.025em;line-height:1}
.ipa{font-family:var(--f-mono);color:var(--muted);font-size:14px}
.wsec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.wsec h4{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body);font-weight:700;margin-bottom:6px}
.wsec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.convo{display:flex;flex-direction:column;gap:6px;font-size:14px}
.convo div b{display:inline-block;min-width:22px;color:var(--muted);font-weight:700}
.word-dots{display:flex;gap:6px}
.word-dots button{all:unset;cursor:pointer;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:650;border:1px solid var(--line);background:var(--surface)}
.word-dots button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.word-dots button.dn{border-color:var(--good);color:var(--good)}
.status-track{display:flex;gap:3px}
.status-track i{flex:1;height:5px;border-radius:3px;background:var(--surface-3)}
.status-track i.on{background:var(--accent)}

/* tense */
.tense-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tense-tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:9px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tense-tile:hover{border-color:var(--accent-line)}
.tense-tile .pct{font-family:var(--f-display);font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1}
.tense-tile.weak{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper span{flex:1;min-width:24px;height:6px;border-radius:4px;background:var(--surface-3)}
.stepper span.d{background:var(--accent)}
.stepper span.c{background:var(--ink)}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex{padding:10px 14px;border-left:3px solid var(--accent-line);background:var(--surface-2);border-radius:0 9px 9px 0;font-size:14.5px}
.ex small{display:block;color:var(--muted);font-size:12.5px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:min(56vh,540px);overflow-y:auto;padding:4px 2px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.5}
.msg.them{background:var(--surface-2);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg .who{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.65;margin-bottom:2px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{min-height:52px;height:52px}

/* score report */
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.score{padding:14px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.score .n{font-family:var(--f-display);font-size:28px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1}
.score .n small{font-size:13px;color:var(--muted);font-weight:500}
.score .l{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.score.na .n{font-size:15px;color:var(--muted);font-family:var(--f-body);font-weight:600}
.fix{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:14px;border-radius:12px;border:1px solid var(--line);font-size:14px}
.fix dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding-top:3px}
.fix dd{margin:0;min-width:0}
.fix .o{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.fix .c{color:var(--good);font-weight:600}
